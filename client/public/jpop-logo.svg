<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="50%" stop-color="#E84118" />
      <stop offset="100%" stop-color="#9C1C1C" />
    </linearGradient>

    <!-- Popcorn Kernel Gradients -->
    <linearGradient id="popcornGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="50%" stop-color="#F9CA24" />
      <stop offset="100%" stop-color="#E09F07" />
    </linearGradient>
    <linearGradient id="popcornButter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFF099" />
      <stop offset="100%" stop-color="#F6B93B" />
    </linearGradient>
    <linearGradient id="popcornHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFF099" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Bucket Gradients -->
    <linearGradient id="bucketRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C23616" />
      <stop offset="50%" stop-color="#EA2027" />
      <stop offset="100%" stop-color="#B71540" />
    </linearGradient>
    <linearGradient id="bucketWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5F6FA" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#DFE4EA" />
    </linearGradient>

    <!-- Badge Gold Gradient -->
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="50%" stop-color="#FFA801" />
      <stop offset="100%" stop-color="#FF5E36" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#560000" flood-opacity="0.4" />
    </filter>
    <filter id="popGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#F9CA24" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Glow Circle -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGrad)" filter="url(#softShadow)" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="#FFD32A" stroke-width="4" stroke-dasharray="10 6" opacity="0.6" />

  <!-- Sparkles & Popping Sparks -->
  <g fill="#FFF275" opacity="0.9">
    <path d="M 120 120 Q 120 135 105 135 Q 120 135 120 150 Q 120 135 135 135 Q 120 135 120 120 Z" />
    <path d="M 380 110 Q 380 125 365 125 Q 380 125 380 140 Q 380 125 395 125 Q 380 125 380 110 Z" />
    <path d="M 90 280 Q 90 290 80 290 Q 90 290 90 300 Q 90 290 100 290 Q 90 290 90 280 Z" />
    <path d="M 405 270 Q 405 280 395 280 Q 405 280 405 290 Q 405 280 415 280 Q 405 280 405 270 Z" />
    <circle cx="160" cy="90" r="4" fill="#FFFFFF" />
    <circle cx="340" cy="85" r="5" fill="#FFFFFF" />
    <circle cx="250" cy="65" r="6" fill="#FFD32A" />
  </g>

  <!-- Popcorn Overflow Kernels (Background layer) -->
  <g filter="url(#popGlow)">
    <!-- Back Popcorn Cluster -->
    <ellipse cx="180" cy="140" rx="35" ry="32" fill="url(#popcornGold)" />
    <ellipse cx="320" cy="140" rx="35" ry="32" fill="url(#popcornGold)" />
    <ellipse cx="250" cy="120" rx="42" ry="38" fill="url(#popcornGold)" />
    <ellipse cx="140" cy="175" rx="32" ry="30" fill="url(#popcornButter)" />
    <ellipse cx="360" cy="175" rx="32" ry="30" fill="url(#popcornButter)" />
  </g>

  <!-- Front Popcorn Cluster (Detailed Puffy Kernels) -->
  <g>
    <!-- Kernel 1 (Left top) -->
    <path d="M 160 170 C 145 150 165 125 190 135 C 205 120 230 135 225 155 C 240 165 235 190 215 195 C 195 205 165 195 160 170 Z" fill="url(#popcornButter)" stroke="#E09F07" stroke-width="2"/>
    <ellipse cx="185" cy="150" rx="15" ry="10" fill="url(#popcornHighlight)"/>
    <circle cx="195" cy="165" r="4" fill="#D980FA" opacity="0.3"/> <!-- subtle seasoning -->

    <!-- Kernel 2 (Right top) -->
    <path d="M 280 155 C 275 130 300 115 320 130 C 345 120 365 145 350 170 C 365 185 345 210 325 200 C 305 210 280 185 280 155 Z" fill="url(#popcornButter)" stroke="#E09F07" stroke-width="2"/>
    <ellipse cx="320" cy="145" rx="16" ry="10" fill="url(#popcornHighlight)"/>

    <!-- Kernel 3 (Center Top - Big King Kernel) -->
    <path d="M 220 130 C 205 105 235 85 255 100 C 275 80 305 105 290 130 C 310 145 295 175 275 170 C 255 180 230 165 225 145 Z" fill="url(#popcornButter)" stroke="#E09F07" stroke-width="2.5"/>
    <ellipse cx="255" cy="115" rx="20" ry="12" fill="url(#popcornHighlight)"/>

    <!-- Kernel 4 (Center Front) -->
    <path d="M 210 190 C 195 170 215 150 240 160 C 260 145 285 160 280 180 C 295 195 280 220 260 215 C 240 225 215 210 210 190 Z" fill="url(#popcornGold)" stroke="#B37700" stroke-width="2"/>
    <ellipse cx="245" cy="175" rx="14" ry="8" fill="url(#popcornHighlight)"/>

    <!-- Kernel 5 (Far Left popped) -->
    <path d="M 125 205 C 110 190 125 170 145 180 C 160 170 180 185 175 205 C 185 220 170 240 150 235 C 130 240 115 225 125 205 Z" fill="url(#popcornButter)" stroke="#E09F07" stroke-width="1.5"/>

    <!-- Kernel 6 (Far Right popped) -->
    <path d="M 335 205 C 325 185 345 170 365 180 C 385 170 400 190 390 210 C 400 230 380 245 360 235 C 340 245 325 225 335 205 Z" fill="url(#popcornButter)" stroke="#E09F07" stroke-width="1.5"/>
  </g>

  <!-- Popcorn Bucket Body -->
  <g filter="url(#softShadow)">
    <!-- Bucket Outer Shape -->
    <!-- Top width: 280 (110 to 390), Bottom width: 220 (140 to 360), Height: 200 (220 to 420) -->
    <path d="M 120 225 L 145 425 C 145 435 155 440 165 440 L 335 440 C 345 440 355 435 355 425 L 380 225 C 380 215 370 210 360 210 L 140 210 C 130 210 120 215 120 225 Z" fill="url(#bucketWhite)" />

    <!-- Red Stripes (Perspective clip) -->
    <g>
      <!-- Stripe 1 (Left) -->
      <polygon points="150,210 180,210 195,440 170,440" fill="url(#bucketRed)" />
      <!-- Stripe 2 (Center-Left) -->
      <polygon points="215,210 245,210 245,440 220,440" fill="url(#bucketRed)" />
      <!-- Stripe 3 (Center-Right) -->
      <polygon points="280,210 310,210 295,440 270,440" fill="url(#bucketRed)" />
      <!-- Stripe 4 (Right) -->
      <polygon points="345,210 375,210 345,440 320,440" fill="url(#bucketRed)" />
    </g>

    <!-- Top Rim of Bucket -->
    <ellipse cx="250" cy="215" rx="132" ry="16" fill="url(#bucketWhite)" stroke="#E09F07" stroke-width="3"/>
    <ellipse cx="250" cy="215" rx="126" ry="12" fill="#F8EFBA" opacity="0.4"/>
  </g>

  <!-- J-POP Central Emblem Badge -->
  <g filter="url(#badgeShadow)">
    <!-- Ribbon / Badge Background -->
    <rect x="140" y="285" width="220" height="75" rx="18" fill="#1E272E" stroke="#FFD32A" stroke-width="4"/>
    <rect x="145" y="290" width="210" height="65" rx="14" fill="url(#badgeGold)" />
    <rect x="148" y="293" width="204" height="59" rx="11" fill="#8B1A1A" />

    <!-- Stars on Badge -->
    <path d="M 165 322 L 168 329 L 175 330 L 170 335 L 171 342 L 165 338 L 159 342 L 160 335 L 155 330 L 162 329 Z" fill="#FFD32A" />
    <path d="M 335 322 L 338 329 L 345 330 L 340 335 L 341 342 L 335 338 L 329 342 L 330 335 L 325 330 L 332 329 Z" fill="#FFD32A" />

    <!-- J-POP Main Bold Text -->
    <text x="250" y="338" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" font-weight="900" text-anchor="middle" fill="#FFF275" stroke="#480808" stroke-width="2" letter-spacing="3">
      J-POP
    </text>

    <!-- Subtitle Banner Tag -->
    <rect x="175" y="354" width="150" height="22" rx="6" fill="#FFA801" stroke="#FFD32A" stroke-width="1.5"/>
    <text x="250" y="369" font-family="'Trebuchet MS', 'Arial', sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#2C3A47" letter-spacing="2">
      GOURMET POPCORN
    </text>
  </g>
</svg>
